version: "3.9"

services:
  # ── Application ──────────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      EI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eng_intel
      EI_NEO4J_URI: bolt://neo4j:7687
      EI_CHROMA_HOST: chromadb
      EI_CHROMA_PORT: 8000
      EI_TEMPORAL_HOST: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started
      temporal:
        condition: service_started
    restart: unless-stopped

  # ── Temporal Worker ──────────────────────────────────────────────────────
  worker:
    build: .
    command: ["python", "-m", "engineering_intelligence.workflows.worker"]
    env_file: .env
    environment:
      EI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eng_intel
      EI_NEO4J_URI: bolt://neo4j:7687
      EI_CHROMA_HOST: chromadb
      EI_CHROMA_PORT: 8000
      EI_TEMPORAL_HOST: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started
      temporal:
        condition: service_started
    restart: unless-stopped

  # ── Migrations (run once) ───────────────────────────────────────────────
  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      EI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eng_intel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eng_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Neo4j ────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── ChromaDB ─────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.4.24
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"

  # ── Temporal Server ──────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres-temporal
    depends_on:
      postgres-temporal:
        condition: service_healthy

  # Temporal needs its own Postgres (separate from app DB)
  postgres-temporal:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporal
    volumes:
      - postgres_temporal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Temporal UI (optional) ──────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      - temporal

volumes:
  postgres_data:
  postgres_temporal_data:
  neo4j_data:
  chroma_data:
