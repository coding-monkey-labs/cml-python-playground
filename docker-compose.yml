version: "3.9"

services:
  # ── RAG Platform API ──────────────────────────────────────────────
  rag-platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RAG_DATABASE_URL=postgresql+asyncpg://raguser:ragpass@postgres:5432/ragplatform
      - RAG_QDRANT_HOST=qdrant
      - RAG_QDRANT_PORT=6333
      - RAG_QDRANT_GRPC_PORT=6334
      - RAG_WEAVIATE_HOST=weaviate
      - RAG_WEAVIATE_PORT=8080
      - RAG_WEAVIATE_GRPC_PORT=50051
      - RAG_CHROMA_HOST=chroma
      - RAG_CHROMA_PORT=8000
      - RAG_PGVECTOR_URL=postgresql://raguser:ragpass@pgvector:5432/ragvectors
      - RAG_DEBUG=true
      - RAG_LOG_LEVEL=INFO
      - RAG_JWT_SECRET_KEY=dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      weaviate:
        condition: service_started
      chroma:
        condition: service_started
      pgvector:
        condition: service_healthy
    volumes:
      - document_storage:/data/rag-documents
    restart: unless-stopped

  # ── PostgreSQL (Metadata Store) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragplatform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant (Vector Database) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ── Weaviate (Vector Database) ────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    ports:
      - "8080:8080"   # REST API
      - "50051:50051" # gRPC
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

  # ── Chroma (Vector Database) ──────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── PostgreSQL + pgvector (Vector Database) ───────────────────────
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragvectors
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragvectors"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  weaviate_data:
  chroma_data:
  pgvector_data:
  document_storage:
