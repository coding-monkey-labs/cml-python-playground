version: "3.9"

services:
  # ── RAG Platform API ──────────────────────────────────────────────
  rag-platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RAG_DATABASE_URL=postgresql+asyncpg://raguser:ragpass@postgres:5432/ragplatform
      - RAG_QDRANT_HOST=qdrant
      - RAG_QDRANT_PORT=6333
      - RAG_QDRANT_GRPC_PORT=6334
      - RAG_DEBUG=true
      - RAG_LOG_LEVEL=INFO
      - RAG_JWT_SECRET_KEY=dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - document_storage:/data/rag-documents
    restart: unless-stopped

  # ── PostgreSQL (Metadata Store) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragplatform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant (Vector Database) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  document_storage:
